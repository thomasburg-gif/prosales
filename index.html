<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Piste</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
        
        /* Header & Langue */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .lang-select { background: var(--card-bg); color: var(--text-main); border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        
        /* Cartes & Vues */
        .card { background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
        
        /* Image de présentation */
        .game-banner { width: 100%; height: auto; border-radius: 12px; margin-bottom: 15px; object-fit: cover; border: 1px solid #334155; }

        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; color: var(--accent); }
        p { color: var(--text-muted); line-height: 1.5; margin-bottom: 15px; font-size: 0.95rem; }
        
        /* Boutons */
        .btn { width: 100%; background: var(--accent); color: var(--bg-color); border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
        .btn:active { opacity: 0.8; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); margin-top: 10px; }
        .btn-hint { background: transparent; border: 1px dashed var(--warning); color: var(--warning); margin-top: 10px; }

        /* Chrono & Progression */
        .hud { display: flex; justify-content: space-between; align-items: center; background: #0284c7; padding: 12px 16px; border-radius: 12px; font-weight: bold; margin-bottom: 15px; }
        
        /* Inputs & Alertes */
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 10px; }
        .status-msg { margin-top: 10px; font-size: 0.85rem; text-align: center; font-weight: 600; }
        .status-msg.error { color: var(--error); }
        .status-msg.success { color: var(--success); }
        
        .hint-box { background: #334155; border-left: 4px solid var(--warning); padding: 12px; border-radius: 6px; margin-top: 10px; color: #f1f5f9; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <span style="font-weight: 800;">QUEST_APP</span>
        <select id="langSelect" class="lang-select" onchange="changeLanguage()">
            <option value="fr">FR 🇫🇷</option>
            <option value="en">EN 🇬🇧</option>
        </select>
    </header>

    <!-- VUE 1 : Sélection des jeux -->
    <div id="view-selection" class="card">
        <h1 data-i18n="selectGameTitle">Choisissez votre aventure</h1>
        <p data-i18n="selectGameDesc">Scannez un QR code ou sélectionnez un jeu ci-dessous :</p>
        <button class="btn" onclick="loadGame('alsace')">La vieille fable alsacienne</button>
        <button class="btn btn-outline" onclick="loadGame('vigne')">La vigne de l'horreur</button>
    </div>

    <!-- VUE 2 : Présentation du jeu sélectionné -->
    <div id="view-intro" class="card hidden">
        <img id="game-banner" class="game-banner hidden" src="" alt="Illustration du jeu">
        <h1 id="game-title">--</h1>
        <p id="game-theme"></p>
        <p id="game-desc"></p>
        <button class="btn" onclick="startGame()" data-i18n="startBtn">Commencer la partie</button>
    </div>

    <!-- VUE 3 : Interface de jeu -->
    <div id="view-game" class="card hidden">
        <div class="hud">
            <span>⏱️ <span id="timer">01:30:00</span></span>
            <span id="step-indicator">Étape 1/4</span>
        </div>

        <h1 id="step-title">--</h1>
        <p id="step-story"></p>
        
        <!-- Bloc Vérification GPS -->
        <div id="gps-block" style="margin-bottom: 15px;">
            <button class="btn btn-outline" onclick="checkGPS()" data-i18n="gpsBtn">📍 Vérifier ma position</button>
            <div id="gps-status" class="status-msg"></div>
        </div>

        <!-- Bloc Énigme -->
        <div id="riddle-block" class="hidden">
            <p style="color: var(--text-main); font-weight: 600; margin-bottom: 10px;" id="step-riddle"></p>
            <input type="text" id="riddle-answer" placeholder="Votre réponse...">
            <button class="btn" onclick="submitAnswer()" data-i18n="submitBtn">Valider</button>
            
            <button class="btn btn-hint" onclick="showHint()" data-i18n="hintBtn">💡 Demander un indice</button>
            <div id="hint-text" class="hint-box hidden"></div>

            <div id="answer-status" class="status-msg"></div>
        </div>
    </div>
</div>

<script>
const TRANSLATIONS = {
    fr: {
        selectGameTitle: "Choisissez votre aventure",
        selectGameDesc: "Scannez un QR code ou sélectionnez un jeu ci-dessous :",
        startBtn: "Commencer la partie (1h30)",
        gpsBtn: "📍 Vérifier ma position GPS",
        submitBtn: "Valider la réponse",
        hintBtn: "💡 Demander un indice",
        gpsSuccess: "✓ Vous êtes au bon endroit !",
        gpsError: "❌ Vous êtes trop loin du lieu. Rapprochez-vous !",
        wrongAnswer: "❌ Mauvaise réponse, réessayez.",
        timeOver: "⏱️ Temps écoulé !"
    },
    en: {
        selectGameTitle: "Choose your adventure",
        selectGameDesc: "Scan a QR code or select a game below:",
        startBtn: "Start the game (1h30)",
        gpsBtn: "📍 Check my GPS position",
        submitBtn: "Submit Answer",
        hintBtn: "💡 Ask for a hint",
        gpsSuccess: "✓ You are at the right spot!",
        gpsError: "❌ You are too far away. Get closer!",
        wrongAnswer: "❌ Wrong answer, try again.",
        timeOver: "⏱️ Time is up!"
    }
};

const GAMES = {
    alsace: {
        title: { fr: "La vieille fable alsacienne", en: "The Old Alsatian Fable" },
        theme: { fr: "🎄 Magie de Noël, Saint Nicolas & Père Fouettard (Colmar)", en: "🎄 Christmas Magic, St. Nicholas & Knecht Ruprecht (Colmar)" },
        image: "colmar.jpg",
        desc: { 
            fr: "L'esprit du Père Fouettard s'est réveillé au cœur de Colmar. Pour sauver la magie de Noël, parcourez le centre historique et résolvez l'énigme sacrée de Saint Nicolas avant que le chronomètre ne s'éteigne.",
            en: "Knecht Ruprecht's spirit has awakened in Colmar. To save the magic of Christmas, explore the historic center and solve St. Nicholas' riddle."
        },
        steps: [
            {
                title: { fr: "Étape 1 : Le Sceau de la Collégiale", en: "Step 1: The Collegial Seal" },
                story: { 
                    fr: "Rendez-vous devant la Collégiale Saint-Martin. C'est ici que Hans Trapp a jeté son premier sort pour éteindre la lumière de Saint-Nicolas. Pour rompre le maléfice, observe le portail principal.", 
                    en: "Head to St. Martin's Collegiate Church. This is where Hans Trapp cast his first spell. Examine the main portal to break it." 
                },
                coords: { lat: 48.0772, lng: 7.3582 },
                riddle: { 
                    fr: "Combien de petites statues gardent l'arc au-dessus de la porte principale ?", 
                    en: "How many small sculpted figures guard the arch above the main entrance?" 
                },
                hint: {
                    fr: "Regardez attentivement l'archivolte (la voûte sculptée) juste au-dessus du portail d'entrée.",
                    en: "Look closely at the archivolt (sculpted arch) right above the entrance door."
                },
                answer: ["12", "douze"]
            },
            {
                title: { fr: "Étape 2 : Le Piège des Visages", en: "Step 2: The Trap of Faces" },
                story: { 
                    fr: "Dirigez-vous vers la Maison des Têtes (19 Rue des Têtes). Hans Trapp a dissimulé le deuxième indice parmi plus de cent visages en pierre figés à jamais.", 
                    en: "Walk to the House of Heads (19 Rue des Têtes). Hans Trapp hid the second clue among over a hundred stone faces." 
                },
                coords: { lat: 48.0786, lng: 7.3556 },
                riddle: { 
                    fr: "Au sommet du pignon se dresse une statue en bronze. Quel objet tient-elle dans sa main droite ?", 
                    en: "At the top of the gable stands a bronze statue. What object is it holding in its right hand?" 
                },
                hint: {
                    fr: "C'est la statue du Tonnelier réalisée par Auguste Bartholdi tout au sommet de la façade.",
                    en: "It is the statue of the Cooper made by Auguste Bartholdi at the very top of the facade."
                },
                answer: ["tonnelet", "tonneau", "petit tonneau"]
            },
            {
                title: { fr: "Étape 3 : Le Pacte du Koïfhus", en: "Step 3: The Koïfhus Pact" },
                story: { 
                    fr: "Marchez jusqu'à l'Ancienne Douane (Koïfhus), Place de l'Ancienne Douane. C'est sous ces arcades que Saint Nicolas et Hans Trapp ont scellé leur pacte.", 
                    en: "Walk to the Old Custom House (Koïfhus). Under these arcades, St. Nicholas and Hans Trapp sealed their pact." 
                },
                coords: { lat: 48.0758, lng: 7.3592 },
                riddle: { 
                    fr: "Trouvez l'année à 4 chiffres inscrite au-dessus du grand escalier extérieur.", 
                    en: "Find the 4-digit year written above the main exterior staircase." 
                },
                hint: {
                    fr: "Cherchez une date sculptée dans la pierre au sommet de l'escalier à balustrade.",
                    en: "Look for a carved date in the stone at the top of the balustraded staircase."
                },
                answer: "1480"
            },
            {
                title: { fr: "Étape 4 : L'Ultime Clef de la Lauch", en: "Step 4: The Final Key of the Lauch" },
                story: { 
                    fr: "Rejoignez le pont du Quai de la Poissonnerie (Petite Venise). Hans Trapp a voulu jeter la Clef d'Or dans la rivière, mais les eaux gelées l'ont bloquée sous le pont.", 
                    en: "Reach the bridge at Quai de la Poissonnerie (Little Venice). Hans Trapp tried to throw the Golden Key into the river." 
                },
                coords: { lat: 48.0742, lng: 7.3597 },
                riddle: { 
                    fr: "Quel métier historique est représenté sur la plaque fixée au bord de l'eau ?", 
                    en: "Which historical trade is depicted on the plaque near the water?" 
                },
                hint: {
                    fr: "Ce sont les anciens hommes qui naviguaient sur les canaux pour transporter les marchandises.",
                    en: "These were the men who navigated the canals to transport goods."
                },
                answer: ["batelier", "bateliers", "pêcheur", "pêcheurs"]
            }
        ]
    },
    vigne: {
        title: { fr: "La vigne de l'horreur", en: "The Vineyard of Horror" },
        theme: { fr: "🍷 Thriller & Légendes sombres", en: "🍷 Thriller & Dark Legends" },
        image: "",
        desc: { 
            fr: "Une malédiction pèse sur le vignoble... Élucidez le mystère avant la tombée de la nuit.",
            en: "A curse weighs upon the vineyard... Unravel the mystery before nightfall."
        },
        steps: []
    }
};

let currentLang = 'fr';
let currentGame = null;
let currentStepIndex = 0;
let timerInterval = null;
let timeRemaining = 90 * 60;

function changeLanguage() {
    currentLang = document.getElementById('langSelect').value;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (TRANSLATIONS[currentLang][key]) el.innerText = TRANSLATIONS[currentLang][key];
    });
    if (currentGame) updateUI();
}

function loadGame(gameId) {
    currentGame = GAMES[gameId];
    document.getElementById('view-selection').classList.add('hidden');
    document.getElementById('view-intro').classList.remove('hidden');
    updateUI();
}

function updateUI() {
    document.getElementById('game-title').innerText = currentGame.title[currentLang];
    document.getElementById('game-theme').innerText = currentGame.theme[currentLang];
    document.getElementById('game-desc').innerText = currentGame.desc[currentLang];
    
    const banner = document.getElementById('game-banner');
    if (currentGame.image) {
        banner.src = currentGame.image;
        banner.classList.remove('hidden');
    } else {
        banner.classList.add('hidden');
    }
}

function startGame() {
    document.getElementById('view-intro').classList.add('hidden');
    document.getElementById('view-game').classList.remove('hidden');
    timerInterval = setInterval(updateTimer, 1000);
    loadStep(0);
}

function updateTimer() {
    let hours = Math.floor(timeRemaining / 3600);
    let minutes = Math.floor((timeRemaining % 3600) / 60);
    let seconds = timeRemaining % 60;
    
    document.getElementById('timer').innerText = 
        `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    
    if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        alert(TRANSLATIONS[currentLang].timeOver);
    }
    timeRemaining--;
}

function loadStep(index) {
    currentStepIndex = index;
    const step = currentGame.steps[index];
    
    document.getElementById('step-indicator').innerText = `Étape ${index + 1}/${currentGame.steps.length}`;
    document.getElementById('step-title').innerText = step.title[currentLang];
    document.getElementById('step-story').innerText = step.story[currentLang];
    document.getElementById('step-riddle').innerText = step.riddle[currentLang];
    
    // Reset indice
    const hintBox = document.getElementById('hint-text');
    hintBox.classList.add('hidden');
    hintBox.innerText = "";
}

function showHint() {
    const step = currentGame.steps[currentStepIndex];
    const hintBox = document.getElementById('hint-text');
    hintBox.innerText = step.hint[currentLang];
    hintBox.classList.remove('hidden');
}

function checkGPS() {
    const status = document.getElementById('gps-status');
    
    if (!navigator.geolocation) {
        status.innerText = "GPS non supporté par votre navigateur.";
        return;
    }

    navigator.geolocation.getCurrentPosition(position => {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;
        const target = currentGame.steps[currentStepIndex].coords;

        const distance = getDistanceInMeters(userLat, userLng, target.lat, target.lng);

        if (distance <= 50) {
            status.className = "status-msg success";
            status.innerText = TRANSLATIONS[currentLang].gpsSuccess;
            document.getElementById('gps-block').classList.add('hidden');
            document.getElementById('riddle-block').classList.remove('hidden');
        } else {
            status.className = "status-msg error";
            status.innerText = `${TRANSLATIONS[currentLang].gpsError} (${Math.round(distance)}m)`;
        }
    }, () => {
        status.className = "status-msg error";
        status.innerText = "Activez la géolocalisation sur votre téléphone.";
    });
}

function getDistanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const dLat = (lat2-lat1) * Math.PI / 180;
    const dLon = (lon2-lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function normalizeText(text) {
    return text
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
}

function submitAnswer() {
    const inputRaw = document.getElementById('riddle-answer').value;
    const status = document.getElementById('answer-status');
    const step = currentGame.steps[currentStepIndex];

    const cleanedInput = normalizeText(inputRaw);

    if (!cleanedInput) return;

    const validAnswers = Array.isArray(step.answer) ? step.answer : [step.answer];
    const isCorrect = validAnswers.some(ans => normalizeText(ans) === cleanedInput);

    if (isCorrect) {
        status.className = "status-msg success";
        status.innerText = "✓ Bonne réponse !";
        
        document.getElementById('riddle-answer').value = "";
        
        setTimeout(() => {
            if (currentStepIndex + 1 < currentGame.steps.length) {
                document.getElementById('riddle-block').classList.add('hidden');
                document.getElementById('gps-block').classList.remove('hidden');
                document.getElementById('gps-status').innerText = "";
                status.innerText = "";
                loadStep(currentStepIndex + 1);
            } else {
                alert("🎉 Félicitations ! Vous avez libéré la ville du sortilège et terminé le jeu !");
            }
        }, 1500);
    } else {
        status.className = "status-msg error";
        status.innerText = TRANSLATIONS[currentLang].wrongAnswer;
    }
}

window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const gameParam = urlParams.get('game');
    if (gameParam && GAMES[gameParam]) {
        loadGame(gameParam);
    }
};
</script>
</body>
</html>
