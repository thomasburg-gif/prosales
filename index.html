<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Piste</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --admin: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
        
        /* Header & Langue */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .lang-select { background: var(--card-bg); color: var(--text-main); border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        
        /* Cartes & Vues */
        .card { background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
        
        /* Image de présentation */
        .game-banner { width: 100%; height: auto; border-radius: 12px; margin-bottom: 15px; object-fit: cover; border: 1px solid #334155; }

        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; color: var(--accent); }
        p { color: var(--text-muted); line-height: 1.5; margin-bottom: 15px; font-size: 0.95rem; }
        
        /* Boutons */
        .btn { width: 100%; background: var(--accent); color: var(--bg-color); border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
        .btn:active { opacity: 0.8; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); margin-top: 10px; }
        .btn-hint { background: transparent; border: 1px dashed var(--warning); color: var(--warning); margin-top: 10px; padding: 10px; font-size: 0.85rem; }
        .btn-skip { background: var(--admin); color: white; margin-top: 10px; }

        /* Chrono & Progression */
        .hud { display: flex; justify-content: space-between; align-items: center; background: #0284c7; padding: 12px 16px; border-radius: 12px; font-weight: bold; margin-bottom: 15px; }
        
        /* Inputs & Alertes */
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 10px; }
        .status-msg { margin-top: 10px; font-size: 0.85rem; text-align: center; font-weight: 600; }
        .status-msg.error { color: var(--error); }
        .status-msg.success { color: var(--success); }
        
        .hint-box { background: #334155; border-left: 4px solid var(--warning); padding: 12px; border-radius: 6px; margin-top: 10px; color: #f1f5f9; font-size: 0.85rem; line-height: 1.4; }
        
        /* Banner Mode Admin */
        .admin-badge { background: #581c87; color: #e9d5ff; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-align: center; margin-bottom: 10px; border: 1px solid var(--admin); }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <span style="font-weight: 800;">QUEST_APP</span>
        <select id="langSelect" class="lang-select" onchange="changeLanguage()">
            <option value="fr">FR 🇫🇷</option>
            <option value="en">EN 🇬🇧</option>
        </select>
    </header>

    <div id="view-selection" class="card">
        <h1 data-i18n="selectGameTitle">Choisissez votre aventure</h1>
        <p data-i18n="selectGameDesc">Scannez un QR code ou sélectionnez un jeu ci-dessous :</p>
        <button class="btn" onclick="loadGame('alsace')">La vieille fable alsacienne</button>
        <button class="btn btn-outline" onclick="loadGame('vigne')">La vigne de l'horreur</button>
    </div>

    <div id="view-intro" class="card hidden">
        <img id="game-banner" class="game-banner hidden" src="" alt="Illustration du jeu">
        <h1 id="game-title">--</h1>
        <p id="game-theme"></p>
        <p id="game-desc"></p>
        <button class="btn" onclick="startGame()" data-i18n="startBtn">Commencer la partie</button>
    </div>

    <div id="view-game" class="card hidden">
        <div id="admin-indicator" class="admin-badge hidden">⚡ MODE TEST/ADMIN ACTIF</div>

        <div class="hud">
            <span>⏱️ <span id="timer">01:30:00</span></span>
            <span id="step-indicator">Étape 1/4</span>
        </div>

        <h1 id="step-title">--</h1>
        <p id="step-story"></p>
        
        <div id="gps-block" style="margin-bottom: 15px;">
            <button class="btn btn-outline" onclick="checkGPS()" data-i18n="gpsBtn">📍 Vérifier ma position</button>
            <div id="gps-status" class="status-msg"></div>
        </div>

        <div id="riddle-block" class="hidden">
            <p style="color: #38bdf8; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; font-size: 0.8rem;">🧩 Énigme du Saint-Esprit</p>
            <p style="color: var(--text-main); font-weight: 500; margin-bottom: 12px; line-height: 1.5;" id="step-riddle"></p>
            
            <input type="text" id="riddle-answer" placeholder="Entrez la réponse ou le mot secret...">
            <button class="btn" onclick="submitAnswer()" data-i18n="submitBtn">Valider</button>
            
            <button class="btn btn-hint" id="hint-btn-1" onclick="showHint(1)">💡 Indice 1 : Piste de réflexion</button>
            <div id="hint-text-1" class="hint-box hidden"></div>

            <button class="btn btn-hint hidden" id="hint-btn-2" onclick="showHint(2)">🔑 Indice 2 : Solution presque donnée</button>
            <div id="hint-text-2" class="hint-box hidden"></div>

            <button id="skip-btn" class="btn btn-skip hidden" onclick="skipStep()">⏩ Passer cette étape (Admin)</button>

            <div id="answer-status" class="status-msg"></div>
        </div>

        <div style="margin-top: 25px; text-align: center;">
            <button style="background: none; border: none; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; text-decoration: underline;" onclick="toggleAdminMode()">⚙️ Mode Admin / Test</button>
        </div>
    </div>
</div>

<script>
const ADMIN_CODE = "1234";
let isAdminMode = false;

const TRANSLATIONS = {
    fr: {
        selectGameTitle: "Choisissez votre aventure",
        selectGameDesc: "Scannez un QR code ou sélectionnez un jeu ci-dessous :",
        startBtn: "Commencer la partie (1h30)",
        gpsBtn: "📍 Vérifier ma position GPS",
        submitBtn: "Valider la réponse",
        gpsSuccess: "✓ Vous êtes au bon endroit !",
        gpsError: "❌ Vous êtes trop loin du lieu. Rapprochez-vous !",
        wrongAnswer: "❌ Mauvaise réponse, réfléchissez bien à l'énigme.",
        timeOver: "⏱️ Temps écoulé !"
    },
    en: {
        selectGameTitle: "Choose your adventure",
        selectGameDesc: "Scan a QR code or select a game below:",
        startBtn: "Start the game (1h30)",
        gpsBtn: "📍 Check my GPS position",
        submitBtn: "Submit Answer",
        gpsSuccess: "✓ You are at the right spot!",
        gpsError: "❌ You are too far away. Get closer!",
        wrongAnswer: "❌ Wrong answer, think carefully.",
        timeOver: "⏱️ Time is up!"
    }
};

const GAMES = {
    alsace: {
        title: { fr: "La vieille fable alsacienne", en: "The Old Alsatian Fable" },
        theme: { fr: "🎄 Magie de Noël, Saint Nicolas & Père Fouettard (Colmar)", en: "🎄 Christmas Magic, St. Nicholas & Knecht Ruprecht (Colmar)" },
        image: "colmar.jpg",
        desc: { 
            fr: "L'esprit du Père Fouettard (Hans Trapp) a enfermé la lumière de Noël dans un coffre sacré. Pour retrouver la Clef d'Or, vous devez résoudre 4 devinettes basées sur les secrets cachés des plus célèbres monuments de Colmar.",
            en: "Knecht Ruprecht trapped the Christmas light in a sacred chest. Solve 4 riddles on Colmar's secrets to find the Golden Key."
        },
        steps: [
            {
                title: { fr: "Étape 1 : La Griffe du Tailleur de Pierre", en: "Step 1: The Stonemason's Mark" },
                story: { 
                    fr: "Vous êtes devant la Collégiale Saint-Martin. Au Moyen Âge, les tailleurs de pierre qui construisaient les églises laissaient leur 'signature' secrète (les marques de tâcheron) gravée dans le grès rose pour être payés. Hans Trapp a dissimulé le premier symbole sous l'un des gardiens de la pierre.", 
                    en: "At St. Martin's Church, medieval stonemasons carved secret signatures into the pink sandstone. Hans Trapp hid the first symbol here." 
                },
                coords: { lat: 48.0772, lng: 7.3582 },
                riddle: { 
                    fr: "Sur le portail Sud (Porte Saint-Nicolas), observez les figures. L'une d'elles ne tient ni livre ni sceptre, mais un outil tranchant de charpentier ou tailleur. De quel outil s'agit-il ?", 
                    en: "On the South portal, one figure holds neither book nor scepter, but a sharp craftsman tool. What tool is it?" 
                },
                hint1: {
                    fr: "C'est un outil tranchant à manche utilisé par les bâtisseurs pour couper le bois ou tailler la pierre.",
                    en: "It is a sharp tool with a handle used by builders to cut wood or stone."
                },
                hint2: {
                    fr: "C'est une 'Hache' (ou erminette).",
                    en: "It is an 'Axe'."
                },
                answer: ["hache", "l'hache", "une hache", "erminette", "hachette"]
            },
            {
                title: { fr: "Étape 2 : Le Secret Culinaires des Masques", en: "Step 2: The Culinary Secret of the Masks" },
                story: { 
                    fr: "Arrivés au 19 Rue des Têtes devant la Maison des Têtes. Parmi ses 106 visages grimaçants, Hans Trapp a cherché la statue qui symbolise la gourmandise alsacienne préférée de Saint-Nicolas.", 
                    en: "At 19 Rue des Têtes, among 106 stone faces, Hans Trapp sought the statue symbolizing St. Nicholas' favorite Alsatian treat." 
                },
                coords: { lat: 48.0786, lng: 7.3556 },
                riddle: { 
                    fr: "Regardez tout au sommet du pignon : la statue créée par Auguste Bartholdi ne tient pas une épée, mais un objet lié à la plus célèbre boisson d'Alsace. Quel est ce produit local ?", 
                    en: "Look at the very top: the statue holds an object related to Alsace's most famous drink. What local product is it?" 
                },
                hint1: {
                    fr: "Il s'agit de la statue du Tonnelier. Pensez au liquide ambré ou fruité que l'on conserve dans ces fûts en bois.",
                    en: "This is the Cooper's statue. Think of the beverage kept in wooden barrels."
                },
                hint2: {
                    fr: "Le mot recherché est le 'Vin' (ou le 'Vin d'Alsace' / 'Bière').",
                    en: "The word is 'Wine'."
                },
                answer: ["vin", "le vin", "biere", "la biere", "vin d'alsace"]
            },
            {
                title: { fr: "Étape 3 : Le Passage Secret du Marchand", en: "Step 3: The Merchant's Secret Passage" },
                story: { 
                    fr: "Bienvenue au Koïfhus (Ancienne Douane). C'est ici que transitaient toutes les marchandises précieuses du Moyen Âge. Pour échapper aux gardes, Hans Trapp empruntait un passage sous une arche gravée.", 
                    en: "Welcome to Koïfhus. All medieval merchant goods passed here. Hans Trapp escaped under an engraved arch." 
                },
                coords: { lat: 48.0758, lng: 7.3592 },
                riddle: { 
                    fr: "Cherchez les armoiries gravées au-dessus du grand passage voûté traversant le bâtiment. Quel animal mythique (à corps de lion et tête d'aigle) y protège le sceau de Colmar ?", 
                    en: "Look at the coat of arms above the vaulted passage. Which mythical creature (lion body, eagle head) protects Colmar's seal?" 
                },
                hint1: {
                    fr: "Créature fantastique très courante dans l'héraldique médiévale, mi-aigle mi-lion.",
                    en: "A mythical creature, half eagle, half lion."
                },
                hint2: {
                    fr: "Il s'agit du 'Griffon'.",
                    en: "It is the 'Gryphon'."
                },
                answer: ["griffon", "le griffon", "griffin", "un griffon"]
            },
            {
                title: { fr: "Étape 4 : L'Énigme des Bateliers Gelés", en: "Step 4: The Mystery of the Frozen Boatmen" },
                story: { 
                    fr: "Vous voici au Quai de la Poissonnerie, au cœur de la Petite Venise. C'est d'ici que les maraîchers et pêcheurs partaient en barque à fond plat pour livrer les marchés de Noël.", 
                    en: "At Quai de la Poissonnerie (Little Venice), fishermen used flat-bottom boats to reach Christmas markets." 
                },
                coords: { lat: 48.0742, lng: 7.3597 },
                riddle: { 
                    fr: "Saint-Nicolas a caché l'ultime Clef d'Or là où l'on mesurait autrefois le niveau de l'eau. Observez le pont : quel légume emblématique de la choucroute alsacienne était autrefois transporté en abondance par ces bateaux ?", 
                    en: "St. Nicholas hid the Golden Key where water was measured. Which iconic sauerkraut vegetable was carried on these boats?" 
                },
                hint1: {
                    fr: "C'est l'ingrédient principal qui, une fois fermenté, donne la célèbre Choucroute alsacienne.",
                    en: "It is the main vegetable used to make sauerkraut."
                },
                hint2: {
                    fr: "La réponse est le 'Chou'.",
                    en: "The answer is 'Cabbage'."
                },
                answer: ["chou", "le chou", "choux", "les choux"]
            }
        ]
    },
    vigne: {
        title: { fr: "La vigne de l'horreur", en: "The Vineyard of Horror" },
        theme: { fr: "🍷 Thriller & Légendes sombres", en: "🍷 Thriller & Dark Legends" },
        image: "",
        desc: { 
            fr: "Une malédiction pèse sur le vignoble... Élucidez le mystère avant la tombée de la nuit.",
            en: "A curse weighs upon the vineyard... Unravel the mystery before nightfall."
        },
        steps: []
    }
};

let currentLang = 'fr';
let currentGame = null;
let currentStepIndex = 0;
let timerInterval = null;
let timeRemaining = 90 * 60;

function toggleAdminMode() {
    if (!isAdminMode) {
        const pwd = prompt("Saisissez le code d'accès administrateur :");
        if (pwd === ADMIN_CODE) {
            isAdminMode = true;
            document.getElementById('admin-indicator').classList.remove('hidden');
            document.getElementById('skip-btn').classList.remove('hidden');
            alert("✅ Mode Admin activé ! Le GPS sera contourné et vous pouvez passer les étapes.");
        } else {
            alert("❌ Code incorrect.");
        }
    } else {
        isAdminMode = false;
        document.getElementById('admin-indicator').classList.add('hidden');
        document.getElementById('skip-btn').classList.add('hidden');
        alert("Mode Admin désactivé.");
    }
}

function changeLanguage() {
    currentLang = document.getElementById('langSelect').value;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (TRANSLATIONS[currentLang][key]) el.innerText = TRANSLATIONS[currentLang][key];
    });
    if (currentGame) updateUI();
}

function loadGame(gameId) {
    currentGame = GAMES[gameId];
    document.getElementById('view-selection').classList.add('hidden');
    document.getElementById('view-intro').classList.remove('hidden');
    updateUI();
}

function updateUI() {
    document.getElementById('game-title').innerText = currentGame.title[currentLang];
    document.getElementById('game-theme').innerText = currentGame.theme[currentLang];
    document.getElementById('game-desc').innerText = currentGame.desc[currentLang];
    
    const banner = document.getElementById('game-banner');
    if (currentGame.image) {
        banner.src = currentGame.image;
        banner.classList.remove('hidden');
    } else {
        banner.classList.add('hidden');
    }
}

function startGame() {
    document.getElementById('view-intro').classList.add('hidden');
    document.getElementById('view-game').classList.remove('hidden');
    timerInterval = setInterval(updateTimer, 1000);
    loadStep(0);
}

function updateTimer() {
    let hours = Math.floor(timeRemaining / 3600);
    let minutes = Math.floor((timeRemaining % 3600) / 60);
    let seconds = timeRemaining % 60;
    
    document.getElementById('timer').innerText = 
        `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    
    if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        alert(TRANSLATIONS[currentLang].timeOver);
    }
    timeRemaining--;
}

function loadStep(index) {
    currentStepIndex = index;
    const step = currentGame.steps[index];
    
    document.getElementById('step-indicator').innerText = `Étape ${index + 1}/${currentGame.steps.length}`;
    document.getElementById('step-title').innerText = step.title[currentLang];
    document.getElementById('step-story').innerText = step.story[currentLang];
    document.getElementById('step-riddle').innerText = step.riddle[currentLang];
    
    // Reset indices
    document.getElementById('hint-text-1').classList.add('hidden');
    document.getElementById('hint-text-1').innerText = "";
    document.getElementById('hint-text-2').classList.add('hidden');
    document.getElementById('hint-text-2').innerText = "";
    document.getElementById('hint-btn-2').classList.add('hidden');
}

function showHint(level) {
    const step = currentGame.steps[currentStepIndex];
    if (level === 1) {
        const hintBox1 = document.getElementById('hint-text-1');
        hintBox1.innerText = step.hint1[currentLang];
        hintBox1.classList.remove('hidden');
        document.getElementById('hint-btn-2').classList.remove('hidden');
    } else if (level === 2) {
        const hintBox2 = document.getElementById('hint-text-2');
        hintBox2.innerText = step.hint2[currentLang];
        hintBox2.classList.remove('hidden');
    }
}

function checkGPS() {
    const status = document.getElementById('gps-status');
    
    if (isAdminMode) {
        status.className = "status-msg success";
        status.innerText = "⚡ Mode Test : Géolocalisation simulée avec succès !";
        document.getElementById('gps-block').classList.add('hidden');
        document.getElementById('riddle-block').classList.remove('hidden');
        return;
    }

    if (!navigator.geolocation) {
        status.innerText = "GPS non supporté par votre navigateur.";
        return;
    }

    navigator.geolocation.getCurrentPosition(position => {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;
        const target = currentGame.steps[currentStepIndex].coords;

        const distance = getDistanceInMeters(userLat, userLng, target.lat, target.lng);

        if (distance <= 50) {
            status.className = "status-msg success";
            status.innerText = TRANSLATIONS[currentLang].gpsSuccess;
            document.getElementById('gps-block').classList.add('hidden');
            document.getElementById('riddle-block').classList.remove('hidden');
        } else {
            status.className = "status-msg error";
            status.innerText = `${TRANSLATIONS[currentLang].gpsError} (${Math.round(distance)}m)`;
        }
    }, () => {
        status.className = "status-msg error";
        status.innerText = "Activez la géolocalisation sur votre téléphone.";
    });
}

function getDistanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const dLat = (lat2-lat1) * Math.PI / 180;
    const dLon = (lon2-lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function normalizeText(text) {
    return text
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
}

function nextStepOrFinish() {
    if (currentStepIndex + 1 < currentGame.steps.length) {
        document.getElementById('riddle-block').classList.add('hidden');
        document.getElementById('gps-block').classList.remove('hidden');
        document.getElementById('gps-status').innerText = "";
        document.getElementById('answer-status').innerText = "";
        loadStep(currentStepIndex + 1);
    } else {
        alert("🎉 Félicitations ! Vous avez percé les secrets de Colmar, retrouvé la Clef d'Or et sauvé la magie de Noël !");
    }
}

function skipStep() {
    alert("⏩ Étape passée via le mode Admin.");
    nextStepOrFinish();
}

function submitAnswer() {
    const inputRaw = document.getElementById('riddle-answer').value;
    const status = document.getElementById('answer-status');
    const step = currentGame.steps[currentStepIndex];

    const cleanedInput = normalizeText(inputRaw);

    if (!cleanedInput) return;

    const validAnswers = Array.isArray(step.answer) ? step.answer : [step.answer];
    const isCorrect = validAnswers.some(ans => normalizeText(ans) === cleanedInput);

    if (isCorrect) {
        status.className = "status-msg success";
        status.innerText = "✓ Excellente déduction ! Le sortilège s'affaiblit...";
        document.getElementById('
