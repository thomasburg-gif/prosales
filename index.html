<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visite Interactive - Colmar</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --admin: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
        
        /* Header & Langue */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .lang-select { background: var(--card-bg); color: var(--text-main); border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        
        /* Cartes & Vues */
        .card { background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
        
        /* Images de présentation & d'histoire */
        .game-banner { width: 100%; height: 200px; border-radius: 12px; margin-bottom: 15px; object-fit: cover; border: 1px solid #334155; }
        .step-photo { width: 100%; height: 220px; border-radius: 10px; object-fit: cover; margin-bottom: 12px; border: 1px solid #334155; }

        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; color: var(--accent); }
        p { color: var(--text-muted); line-height: 1.5; margin-bottom: 15px; font-size: 0.95rem; }
        
        /* Boutons */
        .btn { width: 100%; background: var(--accent); color: var(--bg-color); border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
        .btn:active { opacity: 0.8; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); margin-top: 10px; }
        .btn-hint { background: transparent; border: 1px dashed var(--warning); color: var(--warning); margin-top: 10px; padding: 10px; font-size: 0.85rem; width: 100%; text-align: center; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-skip { background: var(--admin); color: white; margin-top: 10px; }
        .btn-map { background: #0284c7; color: white; padding: 10px; border-radius: 8px; border: none; font-weight: 600; text-decoration: none; display: inline-block; text-align: center; margin-top: 8px; width: 100%; font-size: 0.85rem; }

        /* Chrono & Progression */
        .hud { display: flex; justify-content: space-between; align-items: center; background: #0284c7; padding: 12px 16px; border-radius: 12px; font-weight: bold; margin-bottom: 15px; }
        
        /* Inputs & Alertes */
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 10px; }
        .status-msg { margin-top: 10px; font-size: 0.85rem; text-align: center; font-weight: 600; }
        .status-msg.error { color: var(--error); }
        .status-msg.success { color: var(--success); }
        
        .hint-box { background: #334155; border-left: 4px solid var(--warning); padding: 12px; border-radius: 6px; margin-top: 8px; color: #f1f5f9; font-size: 0.85rem; line-height: 1.4; }
        .history-box { background: #064e3b; border: 1px solid var(--success); padding: 14px; border-radius: 10px; margin-top: 15px; color: #ecfdf5; font-size: 0.88rem; line-height: 1.5; }
        .admin-badge { background: #581c87; color: #e9d5ff; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-align: center; margin-bottom: 10px; border: 1px solid var(--admin); }
        
        /* Bloc Carte GPS */
        .location-card { background: #0f172a; border: 1px solid #38bdf8; padding: 14px; border-radius: 10px; margin-bottom: 15px; }
        .map-iframe { width: 100%; height: 180px; border-radius: 8px; border: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <span style="font-weight: 800;">VISITE_APP</span>
        <select id="langSelect" class="lang-select" onchange="changeLanguage()">
            <option value="fr">FR 🇫🇷</option>
            <option value="en">EN 🇬🇧</option>
        </select>
    </header>

    <!-- VUE 1 : Sélection des jeux -->
    <div id="view-selection" class="card">
        <h1 data-i18n="selectGameTitle">Choisissez votre parcours</h1>
        <p data-i18n="selectGameDesc">Scannez un QR code ou sélectionnez une visite ci-dessous :</p>
        <button class="btn" onclick="loadGame('alsace')">La vieille fable alsacienne</button>
        <button class="btn btn-outline" onclick="loadGame('vigne')">La vigne de l'horreur</button>
    </div>

    <!-- VUE 2 : Présentation de la visite -->
    <div id="view-intro" class="card hidden">
        <img id="game-banner" class="game-banner hidden" src="" alt="Illustration du jeu">
        <h1 id="game-title">--</h1>
        <p id="game-theme"></p>
        <p id="game-desc"></p>
        <button class="btn" onclick="startGame()" data-i18n="startBtn">Démarrer la visite</button>
    </div>

    <!-- VUE 3 : Interface de la visite -->
    <div id="view-game" class="card hidden">
        <div id="admin-indicator" class="admin-badge hidden">⚡ MODE TEST/ADMIN ACTIF</div>

        <div class="hud">
            <span>⏱️ Temps : <span id="timer">01:30:00</span></span>
            <span id="step-indicator">Étape 1/4</span>
        </div>

        <h1 id="step-title">--</h1>
        
        <!-- Bloc Plan & Guidage GPS -->
        <div class="location-card">
            <p style="color: #38bdf8; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; margin-bottom: 5px;">📍 Prochaine Étape & Plan :</p>
            <p id="step-location-text" style="color: var(--text-main); font-size: 0.9rem; margin-bottom: 8px;"></p>
            
            <iframe id="map-frame" class="map-iframe" src=""></iframe>
            <a id="gmaps-link" class="btn-map" href="" target="_blank">🗺️ Lancer le guidage dans Google Maps</a>
        </div>

        <!-- Validation de la position -->
        <div id="gps-block" style="margin-bottom: 15px;">
            <button class="btn btn-outline" onclick="checkGPS()" data-i18n="gpsBtn">📍 Valider mon arrivée sur place</button>
            <div id="gps-status" class="status-msg"></div>
        </div>

        <!-- Bloc Énigme d'Observation sur place -->
        <div id="riddle-block" class="hidden">
            <p style="color: #22c55e; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; font-size: 0.8rem;">🔍 Énigme d'Observation</p>
            <p style="color: var(--text-main); font-weight: 500; margin-bottom: 12px; line-height: 1.5;" id="step-riddle"></p>
            
            <input type="text" id="riddle-answer" placeholder="Entrez votre réponse...">
            <button class="btn" id="submit-btn" onclick="submitAnswer()" data-i18n="submitBtn">Valider</button>

            <!-- Bloc Histoire & Photo Post-Validation -->
            <div id="history-block" class="history-box hidden">
                <img id="step-photo" class="step-photo" src="" alt="Photo du monument">
                <p style="font-weight: 700; color: #a7f3d0; margin-bottom: 6px;">📜 LE SAVIEZ-VOUS ?</p>
                <p id="history-text" style="color: #ecfdf5; margin-bottom: 15px;"></p>
                <button class="btn" style="background: #10b981; color: white;" onclick="nextStepOrFinish()">Étape suivante ➔</button>
            </div>
            
            <!-- Indices à 2 niveaux -->
            <div id="hints-container">
                <button class="btn-hint" id="hint-btn-1" onclick="showHint(1)">💡 Indice 1 : Piste de recherche</button>
                <div id="hint-text-1" class="hint-box hidden"></div>

                <button class="btn-hint hidden" id="hint-btn-2" onclick="showHint(2)">🔑 Indice 2 : Révéler la réponse</button>
                <div id="hint-text-2" class="hint-box hidden"></div>
            </div>

            <button id="skip-btn" class="btn btn-skip hidden" onclick="skipStep()">⏩ Passer cette étape (Admin)</button>

            <div id="answer-status" class="status-msg"></div>
        </div>

        <div style="margin-top: 25px; text-align: center;">
            <button style="background: none; border: none; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; text-decoration: underline;" onclick="toggleAdminMode()">⚙️ Mode Admin / Test</button>
        </div>
    </div>
</div>

<script>
const ADMIN_CODE = "1234";
let isAdminMode = false;

const TRANSLATIONS = {
    fr: {
        selectGameTitle: "Choisissez votre parcours",
        selectGameDesc: "Scannez un QR code ou sélectionnez une visite ci-dessous :",
        startBtn: "Démarrer la visite",
        gpsBtn: "📍 Valider mon arrivée sur place",
        submitBtn: "Valider la réponse",
        gpsSuccess: "✓ Vous êtes arrivé ! Observez le lieu pour répondre.",
        gpsError: "❌ Vous n'êtes pas assez proche du monument. Suivez la carte !",
        wrongAnswer: "❌ Mauvaise réponse, observez bien ou utilisez un indice !",
        timeOver: "⏱️ Temps écoulé !"
    },
    en: {
        selectGameTitle: "Choose your tour",
        selectGameDesc: "Scan a QR code or select a tour below:",
        startBtn: "Start the tour",
        gpsBtn: "📍 Check location arrival",
        submitBtn: "Submit Answer",
        gpsSuccess: "✓ You arrived! Look around to answer.",
        gpsError: "❌ You are not close enough. Follow the map!",
        wrongAnswer: "❌ Wrong answer, look closely or use a hint!",
        timeOver: "⏱️ Time is up!"
    }
};

const GAMES = {
    alsace: {
        title: { fr: "La vieille fable alsacienne", en: "The Old Alsatian Fable" },
        theme: { fr: "🎄 Magie de Noël, Saint Nicolas & Père Fouettard (Colmar)", en: "🎄 Christmas Magic, St. Nicholas & Knecht Ruprecht (Colmar)" },
        image: "https://images.unsplash.com/photo-1543872084-c7bd3822856f?q=80&w=800",
        desc: { 
            fr: "Parcourez le centre historique de Colmar guidé par une carte interactive. À chaque monument, validez votre position, observez les détails sculptés et découvrez l'histoire fascinante de la ville.",
            en: "Explore Colmar's historic center with an interactive map. At each monument, check your position, observe sculpted details, and discover the town's history."
        },
        steps: [
            {
                title: { fr: "Étape 1 : La Collégiale Saint-Martin", en: "Step 1: St. Martin's Church" },
                coords: { lat: 48.0772, lng: 7.3582 },
                
                location_text: { 
                    fr: "Rendez-vous sur la Place de la Cathédrale, devant le portail Sud de la Collégiale Saint-Martin.", 
                    en: "Head to Church Square, in front of the South portal of St. Martin's Church." 
                },
                
                riddle: { 
                    fr: "Observez les sculptures entourant la porte. L'une des figures sculptées tient un outil tranchant de maçon au lieu d'un livre. Quel est cet outil ?", 
                    en: "Observe the sculptures around the door. One figure holds a sharp mason tool instead of a book. What tool is it?" 
                },
                
                photo: "https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=800",
                
                history: {
                    fr: "Cette hachette (ou erminette) rappelle le rôle fondamental des tailleurs de pierre. En construisant la Collégiale entre 1234 et 1365, ces artisans gravaient leur marque personnelle dans le grès rose pour percevoir leur salaire. Cette figure rend hommage aux bâtisseurs anonymes du gothique alsacien !",
                    en: "This axe symbolizes the crucial role of medieval stonemasons who built St. Martin's Church between 1234 and 1365. Masons carved personal marks on every stone to get paid. This figure honors the anonymous craftsmen of Alsatian Gothic architecture!"
                },

                hint1: { fr: "Regardez attentivement l'archivolte (la voûte sculptée) juste au-dessus du portail. L'outil possède un manche et sert à couper.", en: "Look closely at the arch above the door. The tool has a handle and is used for cutting." },
                hint2: { fr: "Le mot recherché est : HACHE", en: "The word you are looking for is: AXE" },
                answer: ["hache", "l'hache", "une hache", "erminette", "hachette"]
            },
            {
                title: { fr: "Étape 2 : La Maison des Têtes", en: "Step 2: The House of Heads" },
                coords: { lat: 48.0786, lng: 7.3556 },
                
                location_text: { 
                    fr: "Dirigez-vous au 19 Rue des Têtes pour admettre la célèbre façade Renaissance.", 
                    en: "Walk to 19 Rue des Têtes to admire the famous Renaissance facade." 
                },
                
                riddle: { 
                    fr: "Au sommet du pignon, la statue en bronze créée par Bartholdi tient un récipient lié à la boisson la plus célèbre d'Alsace. Quel est ce produit ?", 
                    en: "At the top, the bronze statue holds a vessel related to Alsace's most famous drink. What is this product?" 
                },
                
                photo: "https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?q=80&w=800",
                
                history: {
                    fr: "Construite en 1609 pour le marchand Anton Burger, la Maison des Têtes comporte 106 masques en pierre grotesque. Au sommet du pignon se dresse la statue du Tonnelier créée en 1902 par Auguste Bartholdi, le célèbre sculpteur colmarien créateur de la Statue de la Liberté à New York !",
                    en: "Built in 1609 for merchant Anton Burger, the House of Heads features 106 grotesque stone masks. The top bronze Cooper statue was sculpted in 1902 by Auguste Bartholdi, the famous sculptor from Colmar who created the Statue of Liberty in New York!"
                },

                hint1: { fr: "C'est le Tonnelier tout en haut. Pensez au liquide produit par les vignerons locaux.", en: "It is the Cooper at the top. Think of the beverage made by winemakers." },
                hint2: { fr: "Le mot recherché est : VIN", en: "The word you are looking for is: WINE" },
                answer: ["vin", "le vin", "biere", "la biere", "vin d'alsace"]
            },
            {
                title: { fr: "Étape 3 : Le Koïfhus (Ancienne Douane)", en: "Step 3: The Old Custom House" },
                coords: { lat: 48.0758, lng: 7.3592 },
                
                location_text: { 
                    fr: "Marchez jusqu'à la Place de l'Ancienne Douane devant le bâtiment du Koïfhus.", 
                    en: "Walk to Old Custom Square in front of the Koïfhus building." 
                },
                
                riddle: { 
                    fr: "Observez le blason sculpté au-dessus de la grande voûte traversant le bâtiment. Quel animal mythique (mi-aigle, mi-lion) protège les armoiries de Colmar ?", 
                    en: "Look at the crest carved above the vaulted passage. Which mythical creature (half eagle, half lion) protects Colmar's seal?" 
                },
                
                photo: "https://images.unsplash.com/photo-1548625361-188b8e0e0e0a?q=80&w=800",
                
                history: {
                    fr: "Achevé en 1480, le Koïfhus est le plus ancien bâtiment public profane de Colmar. Toutes les marchandises importées y étaient taxées. Le Griffon sculpté au-dessus de la voûte symbolise la vigilance : la force du lion pour défendre les coffres et la vision de l'aigle pour débusquer la fraude !",
                    en: "Completed in 1480, Koïfhus is Colmar's oldest public secular building. Imported goods were taxed here. The Griffon above the arch symbolizes vigilance: lion strength to protect chests and eagle vision to catch smugglers!"
                },

                hint1: { fr: "Créature mythologique ailée possédant des serres d'aigle et un corps de lion.", en: "Mythological winged creature with eagle talons and lion body." },
                hint2: { fr: "Le mot recherché est : GRIFFON", en: "The word you are looking for is: GRYPHON" },
                answer: ["griffon", "le griffon", "griffin", "un griffon"]
            },
            {
                title: { fr: "Étape 4 : La Petite Venise", en: "Step 4: Little Venice" },
                coords: { lat: 48.0742, lng: 7.3597 },
                
                location_text: { 
                    fr: "Rejoignez le pont du Quai de la Poissonnerie, au cœur de la Petite Venise.", 
                    en: "Reach the bridge at Quai de la Poissonnerie in Little Venice." 
                },
                
                riddle: { 
                    fr: "Quel légume traditionnel de la choucroute alsacienne était autrefois transporté en masse sur ces barques à fond plat ?", 
                    en: "Which traditional sauerkraut vegetable was transported by these flat boats?" 
                },
                
                photo: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=800",
                
                history: {
                    fr: "Le Quai de la Poissonnerie était le centre névralgique des pêcheurs et maraîchers. Ces derniers transportaient des tonnes de choux à bord de barques à fond plat naviguant sur la Lauch. La fermentation du chou en choucroute permettait de conserver des vitamines précieuses durant tout l'hiver !",
                    en: "Quai de la Poissonnerie was the home of fishermen and boatmen. They transported tons of cabbages on flat boats along the Lauch river. Fermenting cabbage into sauerkraut provided essential vitamins through harsh winters!"
                },

                hint1: { fr: "C'est l'ingrédient végétal principal servant à faire la Choucroute.", en: "It is the main vegetable used to make Sauerkraut." },
                hint2: { fr: "Le mot recherché est : CHOU", en: "The word you are looking for is: CABBAGE" },
                answer: ["chou", "le chou", "choux", "les choux"]
            }
        ]
    },
    vigne: {
        title: { fr: "La vigne de l'horreur", en: "The Vineyard of Horror" },
        theme: { fr: "🍷 Thriller & Légendes sombres", en: "🍷 Thriller & Dark Legends" },
        image: "",
        desc: { fr: "Visite des vignobles...", en: "Vineyard tour..." },
        steps: []
    }
};

let currentLang = 'fr';
let currentGame = null;
let currentStepIndex = 0;
let timerInterval = null;
let timeRemaining = 90 * 60;

function toggleAdminMode() {
    if (!isAdminMode) {
        const pwd = prompt("Saisissez le code d'accès administrateur :");
        if (pwd === ADMIN_CODE) {
            isAdminMode = true;
            document.getElementById('admin-indicator').classList.remove('hidden');
            document.getElementById('skip-btn').classList.remove('hidden');
            alert("✅ Mode Admin activé !");
        } else {
            alert("❌ Code incorrect.");
        }
    } else {
        isAdminMode = false;
        document.getElementById('admin-indicator').classList.add('hidden');
        document.getElementById('skip-btn').classList.add('hidden');
        alert("Mode Admin désactivé.");
    }
}

function changeLanguage() {
    currentLang = document.getElementById('langSelect').value;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (TRANSLATIONS[currentLang][key]) el.innerText = TRANSLATIONS[currentLang][key];
    });
    if (currentGame) updateUI();
}

function loadGame(gameId) {
    currentGame = GAMES[gameId];
    if (!currentGame) return;
    document.getElementById('view-selection').classList.add('hidden');
    document.getElementById('view-intro').classList.remove('hidden');
    updateUI();
}

function getText(obj) {
    if (!obj) return "";
    if (typeof obj === 'string') return obj;
    return obj[currentLang] || obj['fr'] || "";
}

function updateUI() {
    if (!currentGame) return;
    document.getElementById('game-title').innerText = getText(currentGame.title);
    document.getElementById('game-theme').innerText = getText(currentGame.theme);
    document.getElementById('game-desc').innerText = getText(currentGame.desc);
    
    const banner = document.getElementById('game-banner');
    if (currentGame.image) {
        banner.src = currentGame.image;
        banner.classList.remove('hidden');
    } else {
        banner.classList.add('hidden');
    }
}

function startGame() {
    document.getElementById('view-intro').classList.add('hidden');
    document.getElementById('view-game').classList.remove('hidden');

    if (!timerInterval) {
        timerInterval = setInterval(updateTimer, 1000);
    }
    loadStep(0);
}

function updateTimer() {
    let hours = Math.floor(timeRemaining / 3600);
    let minutes = Math.floor((timeRemaining % 3600) / 60);
    let seconds = timeRemaining % 60;
    
    document.getElementById('timer').innerText = 
        `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    
    if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        alert(TRANSLATIONS[currentLang].timeOver);
    }
    timeRemaining--;
}

function loadStep(index) {
    currentStepIndex = index;
    const step = currentGame.steps[index];
    if (!step) return;
    
    document.getElementById('step-indicator').innerText = `Étape ${index + 1}/${currentGame.steps.length}`;
    document.getElementById('step-title').innerText = getText(step.title);
    
    document.getElementById('step-location-text').innerText = getText(step.location_text);

    const lat = step.coords.lat;
    const lng = step.coords.lng;
    document.getElementById('map-frame').src = `https://www.openstreetmap.org/export/embed.html?bbox=${lng-0.003}%2C${lat-0.002}%2C${lng+0.003}%2C${lat+0.002}&layer=mapnik&marker=${lat}%2C${lng}`;
    document.getElementById('gmaps-link').href = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

    document.getElementById('step-riddle').innerText = getText(step.riddle);
    
    // Reset UI
    document.getElementById('history-block').classList.add('hidden');
    document.getElementById('submit-btn').classList.remove('hidden');
    document.getElementById('riddle-answer').classList.remove('hidden');
    document.getElementById('riddle-answer').value = "";
    document.getElementById('hints-container').classList.remove('hidden');
    
    document.getElementById('hint-btn-1').classList.remove('hidden');
    document.getElementById('hint-text-1').classList.add('hidden');
    document.getElementById('hint-text-1').innerText = "";
    
    document.getElementById('hint-btn-2').classList.add('hidden');
    document.getElementById('hint-text-2').classList.add('hidden');
    document.getElementById('hint-text-2').innerText = "";
}

function showHint(level) {
    const step = currentGame.steps[currentStepIndex];
    if (!step) return;
    
    if (level === 1) {
        const hintBox1 = document.getElementById('hint-text-1');
        hintBox1.innerText = getText(step.hint1);
        hintBox1.classList.remove('hidden');
        document.getElementById('hint-btn-2').classList.remove('hidden');
    } else if (level === 2) {
        const hintBox2 = document.getElementById('hint-text-2');
        hintBox2.innerText = getText(step.hint2);
        hintBox2.classList.remove('hidden');
    }
}

function checkGPS() {
    const status = document.getElementById('gps-status');
    
    if (isAdminMode) {
        status.className = "status-msg success";
        status.innerText = "⚡ Mode Test : Position simulée avec succès !";
        document.getElementById('gps-block').classList.add('hidden');
        document.getElementById('riddle-block').classList.remove('hidden');
        return;
    }

    if (!navigator.geolocation) {
        status.innerText = "GPS non supporté par votre navigateur.";
        return;
    }

    navigator.geolocation.getCurrentPosition(position => {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;
        const target = currentGame.steps[currentStepIndex].coords;

        const distance = getDistanceInMeters(userLat, userLng, target.lat, target.lng);

        if (distance <= 50) {
            status.className = "status-msg success";
            status.innerText = TRANSLATIONS[currentLang].gpsSuccess;
            document.getElementById('gps-block').classList.add('hidden');
            document.getElementById('riddle-block').classList.remove('hidden');
        } else {
            status.className = "status-msg error";
            status.innerText = `${TRANSLATIONS[currentLang].gpsError} (${Math.round(distance)}m)`;
        }
    }, () => {
        status.className = "status-msg error";
        status.innerText = "Activez la géolocalisation sur votre téléphone.";
    });
}

function getDistanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const dLat = (lat2-lat1) * Math.PI / 180;
    const dLon = (lon2-lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function normalizeText(text) {
    return text
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
}

function nextStepOrFinish() {
    if (currentStepIndex + 1 < currentGame.steps.length) {
        document.getElementById('riddle-block').classList.add('hidden');
        document.getElementById('gps-block').classList.remove('hidden');
        document.getElementById('gps-status').innerText = "";
        document.getElementById('answer-status').innerText = "";
        loadStep(currentStepIndex + 1);
    } else {
        alert("🎉 Félicitations ! Vous avez terminé la visite de Colmar !");
    }
}

function skipStep() {
    alert("⏩ Étape passée via le mode Admin.");
    nextStepOrFinish();
}

function submitAnswer() {
    const inputRaw = document.getElementById('riddle-answer').value;
    const status = document.getElementById('answer-status');
    const step = currentGame.steps[currentStepIndex];

    const cleanedInput = normalizeText(inputRaw);

    if (!cleanedInput) return;

    const validAnswers = Array.isArray(step.answer) ? step.answer : [step.answer];
    const isCorrect = validAnswers.some(ans => normalizeText(ans) === cleanedInput);

    if (isCorrect) {
        status.className = "status-msg success";
        status.innerText = "✓ Bonne réponse !";
        
        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('riddle-answer').classList.add('hidden');
        document.getElementById('hints-container').classList.add('hidden');

        const historyBox = document.getElementById('history-block');
        document.getElementById('step-photo').src = step.photo;
        document.getElementById('history-text').innerText = getText(step.history);
        historyBox.classList.remove('hidden');

    } else {
        status.className = "status-msg error";
        status.innerText = TRANSLATIONS[currentLang].wrongAnswer;
    }
}

window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const gameParam = urlParams.get('game');
    if (gameParam && GAMES[gameParam]) {
        loadGame(gameParam);
    }
};
</script>
